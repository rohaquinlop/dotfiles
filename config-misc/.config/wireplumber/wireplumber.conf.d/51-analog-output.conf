# Keep the analog output usable and default on this ThinkPad.
#
# Two separate things move audio to the monitor when HDMI is plugged in, and
# both are handled here:
#
# 1. Default sink.  WirePlumber ranks candidate sinks by priority.session; a
#    plugged monitor used to win because its node came with a higher one. The
#    HDMI sinks now sit far below the laptop's analog node (1000) and below
#    Bluetooth (1010), so they only become the default when no other output is
#    left, or when picked by hand with `wpctl set-default`.
#
#    A sink picked by hand is stored by WirePlumber and outranks everything
#    here, so check `wpctl status` for a stale `*` on an HDMI sink first:
#    `wpctl clear-default` drops that pin and lets these priorities decide.
#
# 2. Card profile.  The sof-hda-dsp UCM exposes the internal speakers and the
#    headphone jack as *conflicting* devices, so the card has two exclusive
#    profiles: `HiFi (…, Mic1, Mic2, Speaker)` and `HiFi (…, Headphones, …)`.
#    Both contain the HDMI outputs, so with a monitor attached the Headphones
#    profile also counts as available and wins on priority (10300 vs 10200) -
#    even with an empty jack. Its empty-jack device is then disabled, both
#    analog playback switches end up off, and the laptop speakers have no path
#    left at all.
#
#    The profile list below therefore prefers the speakers over the jack. The
#    jack itself needs the other profile, which no priority list can express, so
#    `hda-analog-output.service` switches between them from the jack state
#    (config-misc/.local/bin/hda-analog-output). This rule is the fallback for
#    the first seconds of a boot, and the definition of intent.
#
# Check what a rule did with: wpctl inspect <sink id> | grep priority.session

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HDMI.*" }
    ]
    actions = {
      update-props = {
        priority.session = 400
        priority.driver  = 400
      }
    }
  }
]

device.profile.priority.rules = [
  {
    matches = [
      { api.alsa.card.name = "sof-hda-dsp" }
    ]
    actions = {
      update-props = {
        # Most preferred first.
        priorities = [
          "HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker)",
          "HiFi (HDMI1, HDMI2, HDMI3, Headphones, Mic1, Mic2)"
        ]
      }
    }
  }
]
