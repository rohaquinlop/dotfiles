# Keep HDMI audio from stealing the default output.
#
# Plugging a monitor into the ThinkPad moved the default sink to the monitor's
# built-in speakers. The HDMI sinks now sit far below the laptop's analog node
# (1000) and below Bluetooth (1010), so they only become the default when they
# are the only output left, or when picked by hand with `wpctl set-default`.
#
# Check with: wpctl inspect <sink id> | grep priority.session

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HDMI.*" }
    ]
    actions = {
      update-props = {
        priority.session = 400
        priority.driver  = 400
      }
    }
  }
]
