<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Terminal font is Noto Sans Mono (a CachyOS default, also available on
       macOS from the font-noto-sans-mono Homebrew cask). Nerd Font glyphs
       (devicons, branch icons, powerline separators) come from the
       symbols-only font so plain text keeps its normal metrics. Follows the
       upstream nerd-fonts fontconfig approach. -->
  <alias>
    <family>Noto Sans Mono</family>
    <prefer>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
