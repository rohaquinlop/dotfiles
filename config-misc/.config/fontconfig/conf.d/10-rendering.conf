<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Subpixel antialiasing (LCD RGB). CachyOS already ships hinting-slight
       and lcdfilter-default; rgba is left to the user. The X1 Carbon's LCD
       panel reads sharper with RGB subpixel than with grayscale antialiasing. -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>
</fontconfig>
