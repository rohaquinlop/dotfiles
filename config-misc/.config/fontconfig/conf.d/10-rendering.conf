<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Rendering rules. Kept out of fonts.conf because `omarchy font set`
     overwrites fonts.conf with a fixed template and would wipe these. -->
<fontconfig>
  <!-- Subpixel antialiasing (LCD RGB). Without this, fontconfig renders
       grayscale antialiasing, which looks sharper/thinner on LCD panels. -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>

  <!-- LCD filter for the subpixel rendering above. Without it FreeType skips
       the filtering pass and subpixel edges show colour fringing. -->
  <match target="font">
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Slight hinting: vertical-only grid snapping, so stems stay on whole
       pixels while glyph shapes and horizontal spacing are left alone.
       Deliberately NOT `none`: macOS can go unhinted because it renders at 2x
       retina, but eDP-1 is 162 DPI at scale 1.25 (~130 effective), where
       unhinted stems land between pixels and smear. That smearing is what
       reads as "low resolution", not a lack of sharpness. -->
  <match target="font">
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
  </match>
</fontconfig>
