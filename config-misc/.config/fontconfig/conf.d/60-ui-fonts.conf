<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- UI font families. Kept out of fonts.conf because `omarchy font set`
     overwrites fonts.conf with a fixed template and would wipe these.

     Omarchy's /usr/share/fontconfig/conf.avail/50-omarchy.conf assigns
     sans-serif / system-ui / -apple-system / BlinkMacSystemFont to Liberation
     Sans. User conf.d files are pulled in by 50-user.conf, which sorts AFTER
     50-omarchy.conf, so by the time these rules run the pattern's family is
     already the literal string "Liberation Sans", so testing for "sans-serif"
     here would never match. Hence the rules below target Liberation Sans. -->
<fontconfig>
  <!-- Redirect Omarchy's sans-serif substitution to Inter, the closest free
       analog to macOS's SF Pro. Catches every generic sans request plus the
       -apple-system / BlinkMacSystemFont / system-ui web font stack. -->
  <match target="pattern">
    <test name="family">
      <string>Liberation Sans</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <!-- Belt and braces: if 50-omarchy.conf ever stops routing these through
       Liberation Sans, prefer Inter directly. -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- Keep Omarchy's fallback chain working for Inter: Nerd Font glyphs and
       colour emoji still resolve when Inter has no coverage. -->
  <alias>
    <family>Inter</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
