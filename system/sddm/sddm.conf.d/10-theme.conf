# Login screen theme (installed to /etc/sddm.conf.d/10-theme.conf).
# The theme itself lives in /usr/share/sddm/themes/cachyos.
[Theme]
Current=cachyos

# Match the desktop cursor (niri's xcursor-theme/xcursor-size in
# niri/.config/niri/cfg/misc.kdl) so it stays visible on the dark background.
CursorTheme=capitaine-cursors
CursorSize=24
