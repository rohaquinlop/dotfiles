onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"

[keys]
prefix = "ctrl+a"
switch_tab = "alt+1..9"
cycle_pane_next = "ctrl+tab"
cycle_pane_previous = "ctrl+shift+tab"

split_vertical = "super+backslash"
split_horizontal = "super+slash"

[terminal]
# Spawn zsh directly in new panes instead of relying on $SHELL. Bare "zsh"
# resolves via PATH on both CachyOS and macOS.
default_shell = "zsh"

[theme.custom]
accent = "#cba6f7"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#3a3b50"
selection_bg = "#42435c"
surface0 = "#3a3b50"
surface1 = "#42435c"
surface_dim = "#161622"
overlay0 = "#646883"
overlay1 = "#a3b4eb"
text = "#cdd6f4"
subtext0 = "#a3b4eb"
mauve = "#f5c2e7"
green = "#a6e3a1"
yellow = "#f9e2af"
red = "#f38ba8"
blue = "#89b4fa"
teal = "#94e2d5"
peach = "#f3a28b"
