<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Terminal font: Noto Sans Mono. Plain Noto Sans Mono has no Nerd Font
       glyphs, and alacritty's per-glyph fallback renders the powerline
       separators badly (the left round cap came out as a thin crescent).
       Point the family at the patched NotoSansM Nerd Font Mono (Arch package
       ttf-noto-nerd): same Noto Sans Mono letterforms, plus the full Nerd
       Font icon set in one font. If the package is missing, fontconfig falls
       back to plain Noto Sans Mono. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>NotoSansM Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
