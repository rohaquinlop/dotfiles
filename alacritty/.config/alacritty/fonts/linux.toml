[font]
# Terminal font: Noto Sans Mono. On Linux, fontconfig redirects this family
# to the patched NotoSansM Nerd Font Mono (ttf-noto-nerd) so text keeps the
# Noto Sans Mono letterforms while the Nerd Font glyphs come from the same
# font (see config-misc/.../fontconfig/conf.d/50-noto-nerd.conf).
normal = { family = "Noto Sans Mono" }
bold = { family = "Noto Sans Mono" }
italic = { family = "Noto Sans Mono" }

# The powerline round caps (U+E0B4/E0B6) are a hair taller than the cell
# Alacritty builds with the default spacing, so the caps stick out below the
# coloured segment and the bottom corner of a prompt pill looks wrong.
#
# The matching offset/glyph_offset depend on the font size and the output
# scale. alacritty-font-size computes them from this font's metrics and writes
# them into ~/.config/alacritty/local.toml, which is imported last and wins
# over this file. The values below are only the fallback for the default font
# size (11.25) at scale 1.25. Run "alacritty-font-size sync" to recompute them.
# The ratios in that script come from this font: do not change the family
# without retuning them.
offset = { y = -1 }
glyph_offset = { y = 0 }
